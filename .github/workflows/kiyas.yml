name: CI

# Runs the LLM-free G1–G11 seed validator (in --strict mode, so W1–W4
# warnings fail the build too) and checks that the shipped
# kiyas.skill stays in sync with skill/kiyas/. Static checks only: this
# pipeline is a `runtime` arbiter for CONTRACT COMPLETENESS, never for idea
# quality — see SKILL.md §"The runtime arbiter".

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate-seeds:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r tools/requirements.txt

      - name: Validate every seed batch (G1–G11, --strict)
        run: |
          set -e
          found=0
          while IFS= read -r f; do
            found=1
            echo "::group::$f"
            python tools/kiyas_validate.py --strict "$f"
            echo "::endgroup::"
          done < <(find examples ledger -name '*kiyas-seed*.y*ml' -print 2>/dev/null)
          if [ "$found" -eq 0 ]; then
            echo "No seed batches found to validate." >&2
            exit 1
          fi

      - name: Self-test — the unfilled template must be REJECTED
        run: |
          set -e
          # The schema doubles as the template, so it still carries
          # placeholder prose. A validator that passes it would pass any
          # batch that was formatted but never filled in.
          if python tools/kiyas_validate.py skill/kiyas/schemas/kiyas-seed.yaml; then
            echo "FAIL: validator accepted the unfilled schema template" >&2
            exit 1
          fi
          echo "OK: validator rejected the unfilled template."

      - name: Self-test — G1/G5 must reject an illet-less, arbiter-less seed
        run: |
          set -e
          # The batch header is complete on every axis this step is not about,
          # so the seed is the only thing left to fail on, and each rule is
          # asserted by name. A bare non-zero exit would let any unrelated
          # violation stand in for the ones this step exists to prove.
          tmp="$(mktemp --suffix=.yaml)"
          cat > "$tmp" <<'YAML'
          batch: {problem: "p", symmetry_check: "KS-1 cuts against it", operators_used: [O1, O2, O3], refuted_patterns_source: "not consulted", discards_note: "nothing refused"}
          seeds:
            - id: KS-1
              tier: H-aday
              operator: O1
              claim: "something"
              illet: ""
              breaking_point: ""
          discards: []
          YAML
          out="$(python tools/kiyas_validate.py "$tmp" || true)"
          echo "$out"
          for rule in G1 G2 G5 G6; do
            echo "$out" | grep -q "$rule: seed KS-1" || { echo "FAIL: $rule did not fire on the empty seed" >&2; exit 1; }
          done
          echo "OK: G1/G2/G5/G6 correctly rejected the empty seed."

      - name: Self-test — AD4 must flag a relative of a refuted pattern
        run: |
          set -e
          tmp="$(mktemp --suffix=.yaml)"
          cat > "$tmp" <<'YAML'
          batch: {problem: "p", symmetry_check: "KS-1 cuts against it", operators_used: [O1, O2, O3], refuted_patterns_source: "examples/refuted-patterns.example.yaml", discards_note: "nothing refused; two framings considered"}
          seeds:
            - id: KS-1
              tier: H-aday
              operator: O1
              claim: "Phase synchronization as a selective alignment mechanism."
              illet: "structural"
              breaking_point: "here"
              cheapest_refutation: {test: "t", adds_capacity: false}
              arbiter: {class: runtime, who: "pytest"}
              prior_art: {searched: true}
              claims_superiority: false
              antipattern_sweep:
                AD1_notation_coincidence: clear
                AD2_surface_resonance: clear
                AD3_confirmation_bias: clear
                AD4_refuted_relative: clear
                AD5_scale_leak: clear
                AD6_trace_base_rate: clear
          discards: []
          YAML
          # The batch header above is complete on every other axis, so AD4 is
          # the only rule left that can fail. The count assertion is what makes
          # that a fact rather than an intention.
          out="$(python tools/kiyas_validate.py --refuted examples/refuted-patterns.example.yaml "$tmp" || true)"
          echo "$out"
          echo "$out" | grep -q "AD4: seed KS-1 resembles refuted pattern" || { echo "FAIL: AD4 did not flag a known-refuted relative" >&2; exit 1; }
          echo "$out" | grep -q "^1 violation(s) found." || { echo "FAIL: the fixture tripped a rule other than AD4; it no longer isolates AD4." >&2; exit 1; }
          echo "OK: AD4 feedback loop is wired, and it fired alone."

      - name: Self-test — G10/G11 must reject a contradictory arbiter and a silent sweep
        run: |
          set -e
          tmp="$(mktemp --suffix=.yaml)"
          cat > "$tmp" <<'YAML'
          batch: {problem: "p", symmetry_check: "KS-1 cuts against it", operators_used: [O1, O2, O3], discards_note: "nothing refused"}
          seeds:
            - id: KS-1
              tier: S
              operator: O1
              claim: "a claim"
              illet: "a structural equivalence"
              breaking_point: "here"
              cheapest_refutation: {test: "run it", adds_capacity: false}
              arbiter: {class: author, who: "me", independent_of_author: true}
              prior_art: {searched: true}
              claims_superiority: false
              antipattern_sweep:
                AD1_notation_coincidence: clear
                AD2_surface_resonance: clear
                AD3_confirmation_bias: clear
                AD4_refuted_relative: clear
                AD5_scale_leak: clear
                AD6_trace_base_rate: clear
          discards: []
          YAML
          out="$(python tools/kiyas_validate.py "$tmp" || true)"
          echo "$out"
          echo "$out" | grep -q "G10:" || { echo "FAIL: G10 did not fire" >&2; exit 1; }
          echo "$out" | grep -q "G11:" || { echo "FAIL: G11 did not fire" >&2; exit 1; }
          echo "OK: G10 and G11 both fired."

      - name: Self-test — G7 must reject a batch with no discard list
        run: |
          set -e
          # The discard list is the section that vanishes silently under a
          # host that rewards agreement, and an empty section is
          # indistinguishable from an unwritten one. If this check ever stops
          # failing, that invisibility is back.
          tmp="$(mktemp --suffix=.yaml)"
          cat > "$tmp" <<'YAML'
          batch: {problem: "p", symmetry_check: "KS-1 cuts against it", operators_used: [O1, O2, O3], refuted_patterns_source: "not consulted"}
          seeds:
            - id: KS-1
              tier: S
              operator: O1
              claim: "a claim"
              illet: "a structural equivalence"
              breaking_point: "here"
              cheapest_refutation: {test: "t", adds_capacity: false}
              arbiter: {class: runtime, who: "pytest"}
              prior_art: {searched: true}
              claims_superiority: false
              antipattern_sweep:
                AD1_notation_coincidence: clear
                AD2_surface_resonance: clear
                AD3_confirmation_bias: clear
                AD4_refuted_relative: clear
                AD5_scale_leak: clear
                AD6_trace_base_rate: clear
          YAML
          out="$(python tools/kiyas_validate.py "$tmp" || true)"
          echo "$out"
          echo "$out" | grep -q "G7: batch has no" || { echo "FAIL: G7 did not fire on a batch with no discards block" >&2; exit 1; }
          # G7 must be the ONLY violation. Without this the second half below
          # passes on a rule it was never about — which is exactly how this
          # step quietly became a G11 test when G11 was introduced.
          echo "$out" | grep -q "^1 violation(s) found." || { echo "FAIL: the fixture tripped a rule other than G7; it no longer isolates G7." >&2; exit 1; }
          echo "OK: G7, and only G7, rejected a batch that recorded no discards."
          # ...and the same batch passes once the absence is declared.
          echo 'discards: []' >> "$tmp"
          sed -i 's/refuted_patterns_source: "not consulted"/refuted_patterns_source: "not consulted", discards_note: "nothing refused; the two obvious reframings were considered"/' "$tmp"
          python tools/kiyas_validate.py "$tmp"
          echo "OK: an explicitly empty discard list with a note is accepted."

      - name: Self-test — G8/G9 must reject an H-aday with no test and no prior art
        run: |
          set -e
          # These two were legal for the whole of v1.0-v1.1 while the prose
          # forbade them outright. If this step ever stops failing, the data
          # contract has drifted below the written one again.
          tmp="$(mktemp --suffix=.yaml)"
          cat > "$tmp" <<'YAML'
          batch: {problem: "p", symmetry_check: "KS-1 cuts against it", operators_used: [O1, O2, O3], refuted_patterns_source: "not consulted", discards_note: "nothing refused"}
          seeds:
            - id: KS-1
              tier: H-aday
              operator: O1
              claim: "a claim"
              illet: "a structural equivalence"
              breaking_point: "here"
              cheapest_refutation: {test: "", adds_capacity: false}
              arbiter: {class: runtime, who: "pytest"}
              prior_art: {searched: false}
              claims_superiority: false
              antipattern_sweep:
                AD1_notation_coincidence: clear
                AD2_surface_resonance: clear
                AD3_confirmation_bias: clear
                AD4_refuted_relative: clear
                AD5_scale_leak: clear
                AD6_trace_base_rate: clear
          discards: []
          YAML
          out="$(python tools/kiyas_validate.py "$tmp" || true)"
          echo "$out"
          echo "$out" | grep -q "G8:" || { echo "FAIL: G8 did not fire" >&2; exit 1; }
          echo "$out" | grep -q "G9:" || { echo "FAIL: G9 did not fire" >&2; exit 1; }
          echo "OK: G8 and G9 both fired."

      - name: Self-test — the warning channel warns without blocking
        run: |
          set -e
          # A warning that blocks is a rule; a rule that cannot block is
          # decoration. This checks the channel is actually two-valued:
          # exit 0 by default, exit 1 under --strict, same finding both times.
          tmp="$(mktemp --suffix=.yaml)"
          cat > "$tmp" <<'YAML'
          batch: {problem: "p", symmetry_check: "the other one cuts against it", operators_used: [O1, O2, O3], refuted_patterns_source: "not consulted", discards_note: "nothing refused"}
          seeds:
            - id: KS-1
              tier: S
              operator: O1
              claim: "a claim"
              illet: "a structural equivalence"
              breaking_point: "here"
              cheapest_refutation: {test: "run it", adds_capacity: false}
              arbiter: {class: author, who: "the author"}
              prior_art: {searched: true}
              claims_superiority: false
              threshold_proposal: "support at >= 15%"
              antipattern_sweep:
                AD1_notation_coincidence: clear
                AD2_surface_resonance: clear
                AD3_confirmation_bias: clear
                AD4_refuted_relative: clear
                AD5_scale_leak: clear
                AD6_trace_base_rate: clear
          discards: []
          YAML
          out="$(python tools/kiyas_validate.py "$tmp")"   # must exit 0
          echo "$out"
          echo "$out" | grep -q "W1:" || { echo "FAIL: W1 did not warn" >&2; exit 1; }
          echo "$out" | grep -q "W3:" || { echo "FAIL: W3 did not warn" >&2; exit 1; }
          if python tools/kiyas_validate.py --strict "$tmp"; then
            echo "FAIL: --strict did not promote warnings to failures" >&2
            exit 1
          fi
          echo "OK: warnings warn by default and fail under --strict."

      - name: Ledger reporter must run
        run: python tools/kiyas_ledger.py ledger/kiyas-ledger.yaml

      - name: templates/ copy must match the schema
        run: |
          # The template is a convenience copy of the schema. Nothing stops
          # the two from drifting except this check — and a drifted template
          # hands users a contract the validator does not enforce.
          diff -u skill/kiyas/schemas/kiyas-seed.yaml templates/kiyas-seed.yaml \
            || { echo "templates/kiyas-seed.yaml has drifted from the schema." >&2; exit 1; }

  skill-package-in-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: kiyas.skill must match skill/kiyas/ contents
        run: |
          python - <<'PY'
          import zipfile, os, sys
          def norm(b): return b.replace(b"\r\n", b"\n")
          z = zipfile.ZipFile("kiyas.skill")
          names = set(z.namelist())
          bad = []
          # every packaged file must match its source
          for name in names:
              src = os.path.join("skill", name)   # arcname is kiyas/... ; source is skill/kiyas/...
              if not os.path.exists(src):
                  bad.append(f"{name}: packaged but missing from source"); continue
              if norm(z.read(name)) != norm(open(src, "rb").read()):
                  bad.append(f"{name}: content differs from skill/{name}")
          # every source file must be packaged
          for root, dirs, files in os.walk("skill/kiyas"):
              # Build artifacts are not source. Iskele's CI went red on
              # 2026-08-11 because a local __pycache__ reached the package;
              # the guard it grew then belongs in all four repos, not one.
              dirs[:] = [d for d in dirs if d != "__pycache__"]
              for f in files:
                  if f.endswith(".pyc"):
                      continue
                  rel = os.path.relpath(os.path.join(root, f), "skill").replace(os.sep, "/")
                  if rel not in names:
                      bad.append(f"{rel}: in source but not packaged")
          if bad:
              print("kiyas.skill is OUT OF SYNC with skill/kiyas/:")
              for b in bad: print("  -", b)
              print("\nRebuild it (see CONTRIBUTING.md) and commit.")
              sys.exit(1)
          print("kiyas.skill is in sync with skill/kiyas/.")
          PY

  skill-scan:
    # A skill is code plus instructions that load into an agent's context and
    # run with the user's permissions, so this repo ships an attack surface,
    # not just a document. This job scans skill/kiyas with skillvet
    # (github.com/V3r7ig0/skillvet) and fails on any high/critical finding.
    #
    # skillvet is pinned to a commit, not a branch: an unpinned security
    # scanner is itself a supply-chain hole, and a rule set that changes
    # under us turns a green run into a claim we cannot reproduce. Bumping
    # the pin is a deliberate commit, and the diff in findings is the point
    # of the bump.
    #
    # Only skills/skillvet is checked out. The upstream repo also carries 44
    # deliberately malicious benchmark fixtures; they are inert test data,
    # but there is no reason to put them on a runner, and endpoint AV
    # heuristics flag them on sight.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Fetch the pinned scanner (scanner only, no benchmark corpus)
        run: |
          set -e
          git clone --quiet --filter=blob:none --no-checkout https://github.com/V3r7ig0/skillvet.git /tmp/skillvet
          git -C /tmp/skillvet sparse-checkout set --no-cone skills/skillvet
          git -C /tmp/skillvet checkout --quiet 7db0c4d30abe05ed2d6f3544e262da5d79af25b5
          echo "skillvet pinned at $(git -C /tmp/skillvet rev-parse --short HEAD)"

      - name: Scan skill/kiyas
        env:
          # The scanner prints a U+2192 in its verdict line; without this it
          # dies on any runner whose stdout is not UTF-8.
          PYTHONIOENCODING: utf-8
        run: |
          set -e
          python /tmp/skillvet/skills/skillvet/scripts/scan_skill.py skill/kiyas --fail-on high
