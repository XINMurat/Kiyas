# Counterpart pages, for the language control on single-language documents.
# Only real pairs are listed: a page whose translation does not exist shows no
# control at all, because a button for a translation that does not exist
# promises one. Mizan's en/reference has no Turkish twin and Kiyas' and
# Iskele's Turkish-only documents have no English one -- those stay unpaired
# and say so by staying silent.
pairs:
  - { en: "/en/usage-guide", tr: "/tr/kullanim-kilavuzu" }

# The layout lives in docs/_layouts/default.html and is byte-identical in all
# four repositories. Everything that differs between them is here, in data --
# four copies of a stylesheet drifting one at a time is the failure this family
# names in its own documentation.
#
# NOTE: no `plugins:` key. Setting it would REPLACE the GitHub Pages default
# plugin set, and two of those defaults are load-bearing here:
# jekyll-optional-front-matter (most pages in docs/ carry none, and without it
# they stop being pages at all) and jekyll-relative-links (the .md links between
# them resolve on github.com and on the site because of it).

defaults:
  - scope: { path: "" }
    values: { layout: "default" }
