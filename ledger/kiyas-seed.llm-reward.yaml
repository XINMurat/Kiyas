      who: "ECE hesabi + dis dogrulayicidan gelen halusinasyon sayimi"
      independent_of_author: true
      latency: "saatler"
      calibration: >
        ECE esigi bu harness'in kendi baseline yayilimindan; PRM
        calismalarindan devralinmaz.
    prior_art:
      searched: true
      relatives:
        - "Kadavath et al. 2022 — language models (mostly) know what they know"
        - "Lin et al. 2022 — teaching models to express uncertainty in words"
        - "Lightman et al. 2023 — PRM"
      strongest_relative: >
        Kadavath 2022: model kendi dogrulugunu zaten belli olcude tahmin
        edebiliyor. Iddianin ayirt edici kismi, hedefin MODELIN OZ-BEYANI
        DEGIL DIS HAKEMIN VERDIKTI olmasi.
      discrimination_test: >
        Dorduncu kol: hedef olarak modelin kendi guven skoru (oz-beyan).
        Dis-hakem hedefi bunu gecmiyorsa iddia Kadavath'in yeniden
