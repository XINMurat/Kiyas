    K-05 tezi kesiyor: onerilen sabit kumesinin kendisi bir odul-hackleme
    kapisi aciyor ([S] = 0.0 serbest eylem). Bu seed dogrulanirsa YZ-002
    onerildigi haliyle [R] olur. Dort YZ ciktisinin hicbiri bu mekanizmayi
    gormedi.
