      AD2_surface_resonance: "clear"
      AD3_confirmation_bias: "clear"
      AD4_refuted_relative: "clear"
      AD5_scale_leak: "flagged: kucuk model"
      AD6_trace_base_rate: "clear"
    scope_caveat: >
      Yalnizca dis hakemin ulasabildigi adimlar icin. Hakemsiz alanlarda bu
