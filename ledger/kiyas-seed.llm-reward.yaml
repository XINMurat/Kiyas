      egitim sinyali seyrek. Seyreklik belli bir esigin altina inerse baslik
      ogrenmez ve deney onkosul-basarisizligiyla kapanir.
    cheapest_refutation:
      test: >
        Ayni gorev, iki kol: (a) katman-degeri odulu, (b) yardimci
        katman-tahmini basligi (etiket = dis hakemin sonraki verdikti).
        Olculen: tutulan kumede halusinasyon orani + ECE. (b) ECE'yi
        iyilestirip halusinasyon oranini oynatmiyorsa yardimci gorev atildir
