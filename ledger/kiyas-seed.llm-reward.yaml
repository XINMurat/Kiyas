        Burada atlanmadi ve kaniti dosyanin icinde: uc aday `discards`
        blogunda gerekceleriyle elendi (ikisi [GB], reddedilmis desenlerin
        akrabasi), ve K-05 partinin tezini kesen simetri tohumu olarak
        duruyor. Alt katmanli tohum yok cunku AD1/AD2/AD4'ten hicbiri bir
        tohumu [NK] veya [S]'ye zorlamadi; K-04'un AD6 bayragi ise semaya
        gore tier degil serh dogurur ve serh yazildi.
        KABULUN GEREKCESI, uyarinin yanlis olmasi DEGIL: uyari dogru bir
