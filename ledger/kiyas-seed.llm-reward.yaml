    kumesi verdi, ve onerilen bilesimsel ceza teriminin Conflict() hakemi
    tanimsiz. Ust iddia YZ-001 (kanit-kapili dongu serbest donguden daha cok
    dogrulanabilir kesif uretir) kontrol kolsuz oldugu icin olculemiyor.
    Ihtiyac: bu uzayda en ucuz curutmesi olan, Mizan registry'sine dogrudan
    girebilecek adaylar.
