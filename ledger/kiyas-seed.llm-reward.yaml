seeds:
  - id: "K-01"
    tier: "H-aday"
    claim: >
      Alti degerli kanit katmani eslemesi, egitim sinyali olarak ikili
      {dogrulandi / dogrulanmadi} eslemesinden daha fazlasini vermez.
    operator: "O4"
    illet: >
      RLVR'de kazanci tasiyan sey DIS YARGININ VARLIGI'dir, etiketin
      granulerligi degil. Limite it: alti katmani ikiye indir. Kalan sey
      cekirdek mekanizmadir. Fark kalmiyorsa katman uzayi egitim acisindan
      anotasyon semasidir, semantik durum uzayi degil -- ve bu, kullanicinin
      kendi acik sorusunun tam cevabi.
    breaking_point: >
      Ikili esleme negatif tarafi ayirt edemez: [R] (curutulmus) ile [Y]
      (uydurma) ayni kovaya duser. Eger kazanc yalnizca NEGATIF tarafin
      ayrismasindan geliyorsa limit testi bunu "fark yok" diye okuyabilir.
      Bu yuzden ucuncu bir kol gerekir: ikili + ayrisik negatif (3 degerli).
    cheapest_refutation:
      test: >
        Tek alan (matematik veya kod), kucuk model, esit veri ve esit compute
        ile uc kol: (a) ikili odul, (b) uc degerli (dogru / yanlis / uydurma),
        (c) alti katman. Adim-duzeyi hata orani ve nihai dogrulukta
        (c)-(a) farki gurultunun icindeyse alti katmanli esleme egitim icin
        dekoratiftir -> YZ-002 [R].
      adds_capacity: false
      matched_budget_control: >
        Kapasite eklenmiyor (yalnizca odul etiketi degisiyor), ama compute
        esitlenmeli: uc kol ayni token ve ayni kosum sayisini gorur. Esitsiz
        compute bu deneyde kapasite-confound'un yerine gecer.
