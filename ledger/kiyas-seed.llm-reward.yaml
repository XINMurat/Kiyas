      who: "deterministik dogrulayici (birim test kosumu / Lean / Z3) + sabit tohum kumesi"
      independent_of_author: true
      latency: "saatler"
      calibration: >
        Esik bu kosum hattinin kendi tohum-arasi yayilimindan turetilir;
        PRM literaturunun bildirdigi marjlardan devralinmaz (A3).
    prior_art:
