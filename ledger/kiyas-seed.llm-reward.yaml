      AD2_surface_resonance: "clear — illet yapisal (yargi varligi vs etiket granulerligi)"
      AD3_confirmation_bias: "clear — K-05 tezi kesiyor"
      AD4_refuted_relative: "clear — refuted-patterns.yaml'da eslesme yok"
      AD5_scale_leak: "flagged: kucuk model, tek alan; buyuk olcege genelleme ayri seed"
