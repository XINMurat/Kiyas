# Kıyas survival ledger — the skill's own claim, made measurable.
#
# SKILL.md states the honest success metric: the survival rate of
# Kıyas-generated [H-aday] seeds in a Mizan registry, compared against free
# brainstorming. This file is where that record accumulates. Until it has
# entries, that claim is [S] — and saying so is the point.
#
# Append-only, like a Mizan registry: a seed that gets refuted STAYS, with
# final_tier R. Deleting losses is how a 50% hit rate becomes a 100% one.
#
# final_tier: K | H | R | KKE | Y | "" (empty = not yet decided)
# control: true marks a seed generated WITHOUT the Kıyas discipline
#          (free brainstorm on the same problem, scored by the same
#          registry). Without such entries the rate stays descriptive.
#
#   python tools/kiyas_ledger.py ledger/kiyas-ledger.yaml
#
# ---------------------------------------------------------------------
# STATUS 2026-08-19 — read this before reading any number below.
#
# First real entries: the six seeds of examples/kiyas-seed.jspace.example.yaml.
# NONE of them has been registered or scored yet, so every final_tier is
# empty and the survival rate is currently UNDEFINED, not zero. What the
# ledger buys today is a commitment: the ids exist, the problems are named,
# and later outcomes can no longer be selected after the fact.
#
# Two limits that do not go away by adding more entries:
#   1. There is still NO control arm. Until the same problem is attacked by
#      free brainstorming and scored by the same registry, any rate printed
#      here is descriptive. The tool prints a permanent [KKE] saying so.
#   2. All six seeds share one problem and one generating session, so they
#      are not independent trials. A rate over them would be a rate over one
#      draw. Independence needs entries from unrelated problems.
#
# KS-J006 is deliberately in the ledger although it was declined at
# generation. A generator that records only the ideas it kept cannot report
# an honest hit rate.
# ---------------------------------------------------------------------

ledger:
  project: "J-space / workspace-subspace transfer (external target)"
  started: "2026-07-23"
  registry: >
    none yet — these seeds have not entered a Mizan registry. When they do,
    put its path or URL here and fill registered_as/final_tier. Leaving this
    field honest is why the rate is undefined rather than flattering.

# ---------------------------------------------------------------------
# KONTROL KOLU — onkayit, 2026-09-06. Sonuc YOK; bu blok bir plandir.
#
# Bu dosyanin yukarisi iki yildir ayni seyi soyluyor: kontrol kolu olmadan
# buradaki oran betimleyicidir. Bugune kadar o kol KURULMADI. Asagisi onu
# kurmanin onkaydidir -- ve bilerek sonuctan ONCE yaziliyor, cunku sonradan
# yazilan bir kontrol tanimi kendi bulacagini bulur.
#
# TASARIM
#   Ayni problem ifadesi iki kola verilir:
#     (A) disiplin kolu  — Kiyas cikti sozlesmesi (illet + kirilma noktasi +
#         en ucuz curutme + prior art), control: false
#     (B) kontrol kolu   — ayni model, ayni baglam, ayni tohum sayisi, ama
#         yalnizca "bu problem icin fikir uret" istemi; control: true
#   Iki kolun tohumlari AYNI Mizan registry'sine, KOR olarak girer: puanlayan
#   kisi tohumun hangi koldan geldigini gormez. Kor bozulursa olcum coker ve
#   sonuc "hucre kapandi" olarak yazilir, oran olarak degil.
#
# ESIK (sonuctan once kilitlendi)
#   sag_kalim(A) - sag_kalim(B) >= 0.20  -> disiplin iddiasi desteklenir
#   fark <= 0.05                          -> [R]: disiplin sag kalimi acmiyor
#   arasi                                 -> guc yetersiz, tek yeniden kosum
#
# DURDURMA KURALI
#   Her kolda 15 puanlanmis tohuma ulasildiginda durulur. "Fark acilana kadar
#   toplamak" bu esigi anlamsiz kilar.
#
# DISLAMA KURALI
#   Uretim aninda reddedilen tohumlar kayitta KALIR (KS-J006 gibi). Disarida
#   birakilan tek sey: kor bozulmus tohumlar. Baska dislama yok.
#
# ONKOSUL
#   Iki kolun da puanlanabilmesi icin tohumlarin gercekten bir Mizan
#   registry'sine girmesi ve sonuclarinin kesinlesmesi gerekir. Bugun bu
#   dosyadaki alti tohumun hicbiri girmemistir; oran hala TANIMSIZ ve
#   kiyas_ledger.py'nin bastigi kalici [KKE] gecerlidir.
#
# ONKAYITLI TAHMIN
#   Yazar farkin 0.05-0.20 araliginda, yani GUC YETERSIZ bolgesinde cikmasini
#   bekliyor. Bu tahmin buraya yaziliyor ki sonuc ne cikarsa ciksin
#   "zaten boyle bekliyorduk" denemesin.
# ---------------------------------------------------------------------

