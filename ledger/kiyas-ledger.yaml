# Kıyas survival ledger — the skill's own claim, made measurable.
#
# SKILL.md states the honest success metric: the survival rate of
# Kıyas-generated [H-aday] seeds in a Mizan registry, compared against free
# brainstorming. This file is where that record accumulates. Until it has
# entries, that claim is [S] — and saying so is the point.
#
# Append-only, like a Mizan registry: a seed that gets refuted STAYS, with
# final_tier R. Deleting losses is how a 50% hit rate becomes a 100% one.
#
# final_tier: K | H | R | KKE | Y | "" (empty = not yet decided)
# control: true marks a seed generated WITHOUT the Kıyas discipline
#          (free brainstorm on the same problem, scored by the same
#          registry). Without such entries the rate stays descriptive.
#
#   python tools/kiyas_ledger.py ledger/kiyas-ledger.yaml
#
# ---------------------------------------------------------------------
# STATUS 2026-08-19 — read this before reading any number below.
#
# First real entries: the six seeds of examples/kiyas-seed.jspace.example.yaml.
# NONE of them has been registered or scored yet, so every final_tier is
# empty and the survival rate is currently UNDEFINED, not zero. What the
# ledger buys today is a commitment: the ids exist, the problems are named,
# and later outcomes can no longer be selected after the fact.
#
# Two limits that do not go away by adding more entries:
#   1. There is still NO control arm. Until the same problem is attacked by
#      free brainstorming and scored by the same registry, any rate printed
#      here is descriptive. The tool prints a permanent [KKE] saying so.
#   2. All six seeds share one problem and one generating session, so they
#      are not independent trials. A rate over them would be a rate over one
#      draw. Independence needs entries from unrelated problems.
#
# KS-J006 is deliberately in the ledger although it was declined at
# generation. A generator that records only the ideas it kept cannot report
# an honest hit rate.
# ---------------------------------------------------------------------

ledger:
