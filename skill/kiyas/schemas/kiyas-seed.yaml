# =====================================================================
# Kıyas Seed Schema v1.4  (kiyas-seed.yaml)
# =====================================================================
# Machine-readable form of the Kıyas output contract. A "seed" is one
# generated idea, carrying everything Mizan needs to preregister it.
#
# Why this file exists: the output contract (illet / breaking point /
# cheapest refutation / prior art / tier) was prose, and prose cannot be
# enforced. This schema turns the contract into data so tools/kiyas_validate.py
# can act as a RUNTIME arbiter for contract completeness.
#
# What the validator can and cannot judge — state this honestly wherever
# the tool is described: it checks that the illet field is FILLED, never
# that the illet is TRUE. Contract integrity is machine-checkable; idea
# quality is not. Dressing the second in the clothes of the first is
# exactly the failure Mizan R8 exists to prevent.
#
# HARD RULES (tools/kiyas_validate.py enforces these):
#   G1. illet MUST be non-empty. An idea whose illet cannot be named was
#       not generated — it is discarded, not called "decorative".
#   G2. breaking_point MUST be non-empty for tier H-aday. An analogy with
#       no stated limit is ornament.
#   G3. If the seed makes a superiority/originality claim
#       (claims_superiority: true) and prior_art.searched is false, the
#       tier is forced to S. The strongest relative must also appear in
#       prior_art.strongest_relative and in the discrimination test.
#   G4. If cheapest_refutation.adds_capacity is true, a matched-budget
#       control arm is MANDATORY; without it a positive result cannot be
#       attributed to the targeted mechanism (project lesson HG28-b).
#   G5. arbiter is MANDATORY and uses the SAME five classes as Mizan R8.
#       This is the typed handoff: a seed leaves Kıyas already carrying
#       the judge that Mizan's registry will demand.
#   G6. Anti-pattern sweep flags (AD1..AD6) MUST be recorded — including
#       explicit "clear". Silence is not the same as a clean sweep.
#   G10. arbiter.independent_of_author MUST NOT be true for class author or
#        none — those classes are by definition not independent. A
#        contradiction inside the arbiter block undoes the one field the
#        whole handoff to Mizan rests on. Ported from the sibling Mizan
#        validator, which has caught this since R8 shipped.
#   G11. batch.refuted_patterns_source MUST be non-empty. "not consulted" is
#        an honest answer; an absent field is not an answer at all, and it
#        makes every AD4 line in the batch unverifiable. Same shape as G6.
#   G12. batch.generation MUST record how the batch was drawn: `seed` and
#        `host`, both non-empty. READ THIS PART CAREFULLY, because it is the
#        rule most likely to be misread as promising something it does not:
#
#          A PINNED SEED DOES NOT MAKE A KIYAS BATCH REPRODUCIBLE.
#
#        The generator is a language model. The same seed, the same problem
#        and the same operators can still produce different seeds, and a
#        schema that implied otherwise would be doing exactly what this
#        family exists to refuse — dressing an unverifiable claim in the
#        clothes of a verified one. Compare G1: the validator checks that
#        the illet is FILLED, never that it is TRUE.
#
#        What generation records is the CONDITIONS of the draw, so two runs
#        can be compared. `inputs_digest` (optional, from
#        tools/kiyas_digest.py) hashes the normalised problem together with
#        the refuted-patterns export, which lets the validator say whether
#        two batches were drawn from the same inputs — so a difference
#        between them is a difference in the draw, not in the question. The
#        digest is verified only when it can be: when the batch consulted
#        nothing, or when the export is passed with --refuted. Otherwise it
#        is recorded and left unchecked, and the validator says nothing
#        rather than implying it was verified.
#
#        "fresh" for an unpinned draw and "unknown" for an unnameable host
#        are honest answers. An absent field is not an answer — same shape
#        as G6 and G11.
#   G7. The `discards` block MUST be present, even when empty. SKILL.md
#       makes the discard list part of the deliverable; until v1.1 the
#       contract had no slot for it, so the one section a host instruction
#       to "stay agreeable" silently deletes was also the one section CI
#       could not notice was missing. An empty list is legal but must be
#       accompanied by batch.discards_note naming what was considered —
#       "state the discards, or state that there were none".
#   G8. cheapest_refutation.test MUST be non-empty for tier H-aday. SKILL.md
#       constraint 3: "if no test can be designed, the idea stays [S]". Until
#       v1.2 the schema demanded the breaking point but not the test that
#       kills the idea — the one field that makes a candidate auditable
#       rather than merely interesting.
#   G9. prior_art.searched MUST be true for tier H-aday. Constraint 4 is
#       unconditional; G3 only ever covered the narrower superiority-claim
#       gate, so a seed declaring claims_superiority: false could reach
#       H-aday having searched nothing.
#
# WARNINGS (W1..W4) — checked but NOT blocking, unless --strict:
#   W1. a numeric threshold_proposal on a seed whose arbiter is author/none.
#   W2. every seed in a batch of 2+ landing at H-aday.
#   W3. batch.symmetry_check naming no seed id from the batch.
#   W4. operator O5 (scale transfer) with no scope_caveat.
#   W5. a pinned (non-"fresh") generation.seed with no inputs_digest — a seed
#       with no record of the inputs it was applied to identifies nothing.
# These have legitimate exceptions, so the right response is to look, not to
# be stopped. Making every flag blocking would teach authors to write batches
# that avoid triggering rules — the same failure G6's design note describes.
#
# MIGRATION v1.3 -> v1.4: G12 adds the generation block. Batches written
# against v1.3 fail it, and the fix is two lines (`seed: "fresh"` plus a
# host). The failure is the point in the same way G7's was: a batch that
# cannot say what drew it cannot be compared with a second run, and the
# comparison is the only thing a non-reproducible generator can offer.
#
# MIGRATION v1.2 -> v1.3: G10 and G11 close the last two findings of
# PROSE-SCHEMA-AUDIT.md. Both shipped batches passed unchanged; a batch that
# fails G11 was not consulting a refuted-patterns export and not saying so.
#
# MIGRATION v1.1 -> v1.2: G8 and G9 close two places where the schema allowed
# what the prose forbids outright (see PROSE-SCHEMA-AUDIT.md). A batch whose
# H-aday seeds already carry a test and a prior-art search is unaffected; both
# shipped examples passed unchanged.
#
# MIGRATION v1.0 -> v1.1: batches written against v1.0 now fail G7. The fix
# is two lines (`discards: []` plus a discards_note) and the failure is the
# point: a batch that cannot say what it refused cannot show it weighed
# anything. Recovering discards after the fact is usually impossible, and
# admitting that is a better record than a reconstructed one — see the note
# in examples/kiyas-seed.example.yaml, which is exactly this case.
#
# Tiers: S (speculative) | H-aday (hypothesis candidate, Mizan-ready)
#        NK (notation-suspect) | GB (fed-back from a refuted pattern)
# =====================================================================

batch:
  problem: >
    The blocked problem in ONE sentence: what is stuck, which constraint
    hurts. Every seed in this batch answers this.
  date: "2026-07-23"
  operators_used: ["O1", "O3", "O6"]   # at least 3 distinct (diversity rule)
  symmetry_check: >
    Which seed in this batch BREAKS the current thesis rather than
    flattering it? Name its id. If none, the batch has confirmation bias.
  refuted_patterns_source: >
    MANDATORY, non-empty (G11). Path to the negative-constraint export
    consulted before generating
    (e.g. refuted-patterns.yaml produced by mizan_export_refuted.py).
    "not consulted" is allowed and honest — it just means AD4 flags in
    this batch are unverified.
  discards_note: >
    MANDATORY when `discards` is empty (G7): what was considered and
    refused nothing, so that an empty list is distinguishable from an
    unwritten one. Leave blank when discards are recorded below.
  generation:                      # MANDATORY (G12) — conditions, not a promise
    seed: "fresh"                  # a pinned value, or the literal "fresh"
    host: "claude-opus-5"          # who drew it; "unknown" is an honest answer
    inputs_digest: "39a96779580d369c"   # optional; tools/kiyas_digest.py
    # A pinned seed does NOT make this batch reproducible — see G12 above.
    # These three fields let a second run be COMPARED with this one: same
    # digest means the two draws saw the same problem and the same refuted
    # export, so any difference between them is a difference in the draw.

seeds:
  - id: "KS-001"
    tier: "H-aday"                  # S | H-aday | NK | GB
    claim: >
      One sentence, refutable. Not a topic — a claim that can be wrong.
    operator: "O1"                  # O1..O7 (see references/operators.md)

    # --- G1: the load-bearing structural equivalence -----------------
    illet: >
      The STRUCTURAL equivalence that carries the analogy — not surface
      resemblance. "What maps to what, and why does it bear load?"
      If this cannot be written in one sentence, discard the seed.

    # --- G2: where the analogy stops ---------------------------------
    breaking_point: >
      Where the analogy/relation breaks down. Mandatory for H-aday.

    # --- G4: the smallest test that could kill it --------------------
    cheapest_refutation:
      test: >
        The smallest experiment that kills this seed. This is the Mizan
        preregistration seed.
      adds_capacity: false          # true if the test adds parameters/capacity
      matched_budget_control: >
        MANDATORY when adds_capacity is true: the symmetric arm giving the
        SAME extra budget to a generic channel (amplitude / diagonal /
        hidden dim). Promotion rule: Δ(target) − Δ(generic) ≥ threshold.
        Write "not applicable" only when adds_capacity is false.

    # --- G5: who returns the verdict (mirrors Mizan R8) --------------
    arbiter:
      class: "instrument"           # runtime | instrument | third_party | author | none
      who: "the concrete judge — script path, person/role, system, cohort"
      independent_of_author: true   # false is the only coherent value for
                                    # class author / none (G10)
      latency: "seconds | days | quarters | never"
      calibration: >
        Where the proposed threshold's null comes from. Derived from THIS
        instrument's own null distribution — never inherited across
        instruments (AD1/A3). "unknown" is an honest answer.

    # --- G3: named lineage -------------------------------------------
    prior_art:
      searched: true                # false + claims_superiority => forced to S
      relatives:
        - "Author Year — what it already does"
      strongest_relative: >
        The real competitor. If it is not in the comparison set, the seed
        is incomplete regardless of tier.
      discrimination_test: >
        How the claimed distinction gets tested AGAINST that strongest
        relative. "Ours is more principled" is not a test.
    claims_superiority: true        # does this seed claim to beat prior art?

    # --- G6: anti-pattern sweep (references/operators.md §3) ---------
    antipattern_sweep:
      AD1_notation_coincidence: "clear"   # clear | flagged: <why>
      AD2_surface_resonance: "clear"
      AD3_confirmation_bias: "clear"      # batch-level, restated per seed
      AD4_refuted_relative: "clear"       # unverified if no refuted-patterns source
      AD5_scale_leak: "clear"
      AD6_trace_base_rate: "clear"
    scope_caveat: >
      MANDATORY when AD5 is flagged: the regime this prediction is scoped
      to. A finding at reduced scale does not become a main-regime claim by
      being restated.
    trace_base_rate: >
      When this seed joins a research trace with N consistent negatives:
      the honest base rate (~hits/N) written INTO the preregistered
      prediction, plus the two-sided scope note — "base ≈0/N BUT the trace
      never sampled this cell" is out-of-distribution and does NOT
      guarantee a strong null prior.

    threshold_proposal: >
      Suggested numeric decision rule. Mizan locks it; Kıyas only proposes.
    cost: "rough effort estimate"
    preregistered_prediction: >
      Optional: what the author expects, written before any result.

    # --- handoff ------------------------------------------------------
    handoff:
      status: "pending"             # pending | registered | declined
      mizan_hypothesis_id: ""       # filled when it enters a Mizan registry
      registry: ""                  # path/URL of that registry

# =====================================================================
# G7 — the discard list. What you refused to generate is information about
# the generation; a batch showing only survivors is indistinguishable from
# one where nothing was ever weighed. This is also the first section a host
# instruction to stay agreeable removes, and the loss is invisible because
# an empty section and an unwritten one are the same absence — which is why
# the key is required rather than optional.
#
# Each entry needs BOTH fields: what was refused, and why. A reason of
# "didn't fit" is not a reason; name the anti-pattern (AD1..AD6) or the
# prior art that saturates it.
# =====================================================================
discards:
  - claim: >
      The idea that was weighed and refused, stated well enough that a
      reader can tell it apart from the seeds that survived.
    reason: >
      Why it was refused: which anti-pattern caught it (AD1 notation
      coincidence, AD2 surface resonance, ...), or which prior art already
      occupies it. "Skip and cite" is a legitimate reason and should say
      whose work it defers to.
