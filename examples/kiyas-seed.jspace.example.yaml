discards:
  - claim: "Direct transfer of zeta zeros / the explicit formula to the Jacobian spectrum"
    reason: >
      AD1 in pure form. The only thing shared between the domains is the
      word "spectrum". No illet could be named that did not reduce to that
      word.
  - claim: "The reported ~10% of activations resembles the fraction of cortex active at a given moment"
    reason: >
      AD2. Two numbers of similar size from unrelated measurement
      traditions, with no base rate for how often such pairs coincide by
      chance and no nameable structural link.
  - claim: >
      The user's cream-separation analogy taken literally: look for spinodal
      decomposition, a critical temperature, a phase boundary during training
    reason: >
      AD2. Physical separation is carried by a conserved quantity under a
      body force with surface energy at the interface; gradient descent has
      no counterpart for any of the three. The physics was dropped and the
      illet replaced, which is what produced KS-J001. See
      examples/distillation-user-analogy.md for the full pass.
  - claim: "Ignition equals a percolation threshold"
    reason: >
      Not an illet failure — the illet is fine. Prior art is saturated:
      the originating theory's own formal model is already a threshold
      dynamic. Skip and cite; generating it as new would be a rediscovery
      dressed as a seed.
  - claim: "Cross-model universality of the workspace subspace"
    reason: >
      Prior art saturated (Platonic Representation Hypothesis; Git-Re-Basin;
      fixed-point universality work), and independently confirmed inside
      this author's own project. Skip and cite.
